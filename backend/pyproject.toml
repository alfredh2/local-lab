[project]
name = "locallab"
version = "0.1.0"
description = "Local AI experimentation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic>=2.6", "pydantic-settings>=2.2", "jsonschema>=4.20", "nvidia-ml-py>=12", "psutil>=5.9", "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["locallab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
